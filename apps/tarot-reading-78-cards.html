</style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">✦ THE TAROT READING ✦</div><h1>星語塔羅</h1><p>78 張經典塔羅牌 × 正逆位解讀 × 深度繁體中文解析。為你的問題換一個視角，從理解現況走向具體行動。</p></header><section class="panel" aria-labelledby="configTitle"><h2 class="section-title" id="configTitle">✧ 開始你的占卜</h2><div class="fields"><div class="field"><label for="topic">占卜主題</label><select id="topic"><option>綜合</option><option>感情</option><option>工作</option><option>財務</option><option>人際</option><option>自我成長</option></select></div><div class="field"><label for="spreadType">牌陣</label><select id="spreadType"><option value="1">單張指引｜當下啟示</option><option value="3" selected>三張牌陣｜過去・現在・未來</option><option value="5">五張牌陣｜現況・阻礙・資源・建議・趨勢</option></select></div><div class="field wide"><label for="question">你想探索的問題（選填）</label><textarea maxlength="250" id="question" placeholder="例如：面對新的工作機會，我該注意什麼？建議用開放式問題，避免只問『會不會』。"></textarea><div class="hint">你的提問只在目前的瀏覽器中處理，不會傳送到外部伺服器。</div></div></div><div class="actions"><button id="shuffle" class="btn">✦ 洗牌並抽牌</button><button id="reset" class="btn secondary" type="button">重新開始</button></div><p class="status" id="status" role="status" aria-live="polite">選擇主題與牌陣，準備好就開始。</p><div class="spread" id="spread" aria-label="抽出的塔羅牌"></div></section><section class="panel result" id="result" aria-labelledby="resultTitle"><h2 class="section-title" id="resultTitle">✧ 你的塔羅解讀</h2><div class="summary" id="summary"></div><div class="readings" id="readings" style="margin-top:18px"></div><div class="actions"><button id="copy" class="btn secondary">複製完整解牌</button><button id="save" class="btn secondary">儲存本次紀錄</button></div></section><section class="panel" aria-labelledby="histTitle"><h2 class="section-title" id="histTitle">✧ 我的占卜紀錄</h2><div id="history" class="hint">尚無儲存紀錄。</div><div class="actions"><button class="btn secondary" id="clearHistory">清除所有紀錄</button></div></section><footer class="footer">塔羅占卜是一種象徵性自我探索工具，沒有科學證據能證明它可以預測未來。<br>重要的醫療、法律、財務及人生決策，仍應依據事實並諮詢適當的專業人士。<br>本網站可離線使用，不需 API Key、帳號、資料庫或外部 CDN。</footer></main><script>
const DB={"cards":[{"id":"M00","name":"愚者","en":"The Fool","group":"大阿爾克那","number":0,"icon":"✦","up":"新旅程、自由、勇氣","rev":"衝動、缺乏準備、逃避責任","upDetail":"你正站在新階段的門口。這張牌提醒你保有好奇與勇氣，但不代表可以跳過必要的準備。","revDetail":"暫緩倉促決定，檢查自己是否因為想逃離現況，而忽略眼前的風險。","action":"先嘗試一個成本可控的小步驟，讓未知變成可驗證的經驗。"},{"id":"M01","name":"魔術師","en":"The Magician","group":"大阿爾克那","number":1,"icon":"✧","up":"資源整合、主動、創造力","rev":"分心、技巧失衡、操控","upDetail":"你已經擁有某些關鍵資源，重點在於把想法轉化為可執行的安排。","revDetail":"注意過度包裝或只談可能性而沒有成果，也要辨識他人的承諾是否可信。","action":"列出手上的人脈、技能與時間，選擇一件最重要的事立即推進。"},{"id":"M02","name":"女祭司","en":"The High Priestess","group":"大阿爾克那","number":2,"icon":"☾","up":"直覺、觀察、潛在訊息","rev":"資訊封閉、忽略直覺、困惑","upDetail":"目前未必適合急著表態。留意尚未浮現的資訊，也聽聽自己反覆出現的感受。","revDetail":"你可能把沉默當作答案，或因為猜測過多而失去判斷依據。","action":"先蒐集事實，寫下直覺與證據各自支持什麼。"},{"id":"M03","name":"皇后","en":"The Empress","group":"大阿爾克那","number":3,"icon":"❀","up":"滋養、豐盛、關係成長","rev":"過度照顧、依賴、耗竭","upDetail":"好的成果需要時間培養。照顧關係與創造舒適環境，會讓事情更穩定地成長。","revDetail":"當付出失衡時，愛與照顧可能變成壓力；你也需要保留自己的界線。","action":"投入一個能長期滋養自己的習慣，並說明自己的需要。"},{"id":"M04","name":"皇帝","en":"The Emperor","group":"大阿爾克那","number":4,"icon":"♜","up":"結構、責任、領導","rev":"僵化、控制、權威衝突","upDetail":"此刻適合建立規則與責任分工，讓想法具有持續執行的基礎。","revDetail":"過度強調掌控會讓溝通受阻；檢查規則是否仍服務真正的目標。","action":"明確寫出目標、界線與決策方式。"},{"id":"M05","name":"教皇","en":"The Hierophant","group":"大阿爾克那","number":5,"icon":"✥","up":"傳承、制度、導師","rev":"挑戰傳統、教條、價值衝突","upDetail":"成熟的方法與前人的經驗可能提供可靠參考，尤其適合需要學習與合作的議題。","revDetail":"別因為別人都這樣做，就忽略自己的價值觀與實際情況。","action":"請教有經驗的人，並辨別哪些慣例值得保留。"},{"id":"M06","name":"戀人","en":"The Lovers","group":"大阿爾克那","number":6,"icon":"♡","up":"選擇、契合、價值一致","rev":"失衡、猶豫、價值分歧","upDetail":"這不只是在談感情，也代表重要的價值選擇。真正的契合來自清楚而自願的承諾。","revDetail":"表面和諧可能掩蓋分歧，避免為了獲得認同而犧牲原則。","action":"列出自己的核心價值，與相關的人坦誠溝通。"},{"id":"M07","name":"戰車","en":"The Chariot","group":"大阿爾克那","number":7,"icon":"➶","up":"決心、方向、自律","rev":"失控、方向分散、硬碰硬","upDetail":"局勢需要集中意志與行動。當你知道要去哪裡，持續的節奏比一時衝刺更重要。","revDetail":"想用意志強壓所有問題，反而可能讓自己失去方向。","action":"選定優先目標，刪除一項不必要的干擾。"},{"id":"M08","name":"力量","en":"St function randomInt(max){const a=new Uint32Array(1);const lim=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%max}
function draw(){let count=Number($('#spreadType').value),pool=[...DB.cards],cards=[];for(let i=0;i<count;i++){let index=randomInt(pool.length);cards.push({id:pool.splice(index,1)[0].id,reversed:randomInt(2)===1})}current={id:Date.now(),time:new Date().toLocaleString('zh-TW',{hour12:false}),topic:$('#topic').value,question:$('#question').value.trim(),cards};render(current);$('#status').textContent='抽牌完成。請閱讀下方解牌，找出對自己有幫助的訊息。'}
function render(reading){current=reading;$('#topic').value=reading.topic;$('#spreadType').value=String(reading.cards.length);$('#question').value=reading.question;let names=positions[reading.cards.length];$('#spread').innerHTML=reading.cards.map((item,i)=>{let card=DB.cards.find(c=>c.id===item.id);return `<div class="slot"><div class="slot-label">${esc(names[i])}</div><div class="tarot ${item.reversed?'reversed':''}" aria-label="${esc(card.name)}${item.reversed?'逆位':'正位'}"><div class="face"><div class="symbol">${card.icon}</div><div class="name">${esc(card.name)}</div><div class="english">${esc(card.en)}</div></div></div><div class="orientation">${item.reversed?'↕ 逆位':'↑ 正位'}</div></div>`}).join('');let context=DB.contexts[reading.topic],intro=`主題：${reading.topic}｜${reading.cards.length} 張牌陣`;
const items=reading.cards.map((item,i)=>{let card=DB.cards.find(c=>c.id===item.id),rv=item.reversed,kw=rv?card.rev:card.up,meaning=rv?card.revDetail:card.upDetail;return {name:card.name,orientation:rv?'逆位':'正位',pos:names[i],kw,meaning,card}});
const upCount=reading.cards.filter(c=>!c.reversed).length,revCount=reading.cards.length-upCount;let synth=reading.cards.length===1?'這次單張牌適合做為當下的思考焦點，不需要急著把它解讀成最終答案。':`本次出現 ${upCount} 張正位與 ${revCount} 張逆位。正逆位不是好壞分數，而是不同角度的提醒。請把牌陣當成一個連續的思考框架，而非確定會發生的劇本。`;
let overview=`<h3>整體訊息</h3><p><strong>${esc(intro)}</strong>${reading.question?`<br>你的問題：${esc(reading.question)}`:''}</p><p>${esc(synth)}</p><p><strong>核心主題：</strong>${esc(items.map(x=>x.kw).join(' → '))}</p><p><strong>反思方向：</strong>${esc(context[1])}</p>`;$('#summary').innerHTML=overview;
$('#readings').innerHTML=items.map((x,i)=>`<article class="reading"><h3>${i+1}. ${esc(x.pos)}｜${esc(x.name)} ${x.orientation}</h3><div class="sub">${esc(x.card.en)} ・ ${esc(x.card.group)} ・ ${esc(positionDetails[x.pos])}</div><p class="keyword"><strong>關鍵訊息：</strong>${esc(x.kw)}</p><p><strong>牌義深入解讀：</strong>${esc(x.meaning)}</p><p><strong>結合「${esc(reading.topic)}」主題：</strong>${esc(context[0])}</p><p><strong>這個位置提醒你：</strong>${esc(positionDetails[x.pos])} 對照你的具體問題，檢查這段訊息與現實證據有哪些吻合或不吻合之處。</p><p><strong>可採取的行動：</strong>${esc(x.card.action)}</p><p><strong>給自己的提問：</strong>${esc(context[1])}</p></article>`).join('');
copyText=[`【星語塔羅｜${reading.time}】`,intro,reading.question?'問題：'+reading.question:'',synth,'核心主題：'+items.map(x=>x.kw).join(' → '),...items.flatMap((x,i)=>[`\n${i+1}. ${x.pos}｜${x.name} ${x.orientation}`,`關鍵字：${x.kw}`,`牌義：${x.meaning}`,`主題解析：${context[0]}`,`位置說明：${positionDetails[x.pos]}`,`行動建議：${x.card.action}`,`反思提問：${context[1]}`]),'\n提醒：塔羅僅供自我探索，不代表預測或專業建議。'].filter(Boolean).join('\n');$('#result').classList.add('show');$('#result').scrollIntoView({behavior:'smooth',block:'start'})}
function getHistory(){try{return JSON.parse(localStorage.getItem('tarot-history-v1')||'[]')}catch{return []}}
function renderHistory(){const a=getHistory();$('#history').innerHTML=a.length?a.map((h,i)=>`<div class="history-item"><div><strong>${esc(h.topic)}｜${h.cards.length} 張牌</strong><br><span>${esc(h.time)}${h.question?'｜'+esc(h.question.slice(0,48)):''}</span></div><button type="button" data-idx="${i}">查看</button></div>`).join(''):'尚無儲存紀錄。';$('#history').querySelectorAll('[data-idx]').forEach(btn=>btn.addEventListener('click',()=>render(getHistory()[Number(btn.dataset.idx)])))}
$('#shuffle').addEventListener('click',draw);$('#reset').addEventListener('click',()=>{current=null;$('#spread').innerHTML='';$('#result').classList.remove('show');$('#status').textContent='已重設，可重新選擇主題與牌陣。'});$('#save').addEventListener('click',()=>{if(!current)return;let a=getHistory().filter(x=>x.id!==current.id);a.unshift(current);try{localStorage.setItem('tarot-history-v1',JSON.stringify(a.slice(0,30)));renderHistory();$('#status').textContent='紀錄已儲存於本機瀏覽器（最多 30 筆）。'}catch{$('#status').textContent='瀏覽器無法儲存紀錄，可能處於無痕或受限制模式。'}});$('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(copyText);$('#status').textContent='已複製完整解牌內容。'}catch{const ta=document.createElement('textarea');ta.value=copyText;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();$('#status').textContent=ok?'已複製完整解牌內容。':'複製失敗，請使用一般瀏覽器環境。'}});$('#clearHistory').addEventListener('click',()=>{if(confirm('確定清除本機儲存的所有占卜紀錄？')){localStorage.removeItem('tarot-history-v1');renderHistory()}});renderHistory();
</script></body></html>
