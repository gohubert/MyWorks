<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>加班工時診斷儀表板</title>
<style>
:root{
  --paper:#EEF2F5;--surface:#FFFFFF;--surface2:#F6F8FA;--ink:#17283A;--ink2:#4A5B6C;--ink3:#7A8A99;
  --line:#D3DBE3;--accent:#1D6A86;--accent-soft:#DCEDF3;
  --s1:#1D6A86;--s2:#C77A2B;--s3:#6E58A8;--s4:#3F8F6A;--s5:#B24C63;--s6:#5C7F9E;--s7:#9A8A2E;--s8:#3E9BA8;
  --ok:#2E8656;--ok-bg:#E2F2E8;--warn:#A87A08;--warn-bg:#FBF0D2;--bad:#BE3B34;--bad-bg:#F9E1DF;
  --heat0:#F1F5F8;--heat1:#1D6A86;
  --radius:10px;--shadow:0 1px 0 rgba(23,40,58,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D141B;--surface:#15202B;--surface2:#1A2734;--ink:#E2E9EF;--ink2:#A9B7C4;--ink3:#7B8B9A;
  --line:#2A3846;--accent:#5BB5D1;--accent-soft:#183644;
  --s1:#5BB5D1;--s2:#E39A52;--s3:#A391E0;--s4:#68C394;--s5:#E07990;--s6:#8FB0CC;--s7:#CFC163;--s8:#6FD0DC;
  --ok:#5CC48A;--ok-bg:#163327;--warn:#E3B53F;--warn-bg:#3A2E10;--bad:#F07169;--bad-bg:#3D1C1B;
  --heat0:#1A2734;--heat1:#5BB5D1;color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0D141B;--surface:#15202B;--surface2:#1A2734;--ink:#E2E9EF;--ink2:#A9B7C4;--ink3:#7B8B9A;
  --line:#2A3846;--accent:#5BB5D1;--accent-soft:#183644;
  --s1:#5BB5D1;--s2:#E39A52;--s3:#A391E0;--s4:#68C394;--s5:#E07990;--s6:#8FB0CC;--s7:#CFC163;--s8:#6FD0DC;
  --ok:#5CC48A;--ok-bg:#163327;--warn:#E3B53F;--warn-bg:#3A2E10;--bad:#F07169;--bad-bg:#3D1C1B;
  --heat0:#1A2734;--heat1:#5BB5D1;color-scheme:dark;}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:"SF Pro Display","Segoe UI","Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)}.small{font-size:13px}
.hidden{display:none!important}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-inner{max-width:1360px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.brand h1{font-size:19px;margin:0;letter-spacing:.02em;font-weight:700}
.brand .meta{font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 14px}
.local-badge{font-size:12px;color:var(--ok);background:var(--ok-bg);border-radius:999px;padding:3px 10px;white-space:nowrap}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0D141B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0D141B}}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--surface)}
.toggle input{accent-color:var(--accent)}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:260px;padding:6px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;font-size:14px}
.menu-pop button:hover{background:var(--surface2)}
.menu-pop .sep{border-top:1px solid var(--line);margin:4px 0}

nav.tabs{max-width:1360px;margin:0 auto;padding:0 20px;display:flex;gap:4px}
nav.tabs button{border:0;background:none;padding:10px 14px;font-size:15px;color:var(--ink2);border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* filters */
.filters{max-width:1360px;margin:14px auto 0;padding:0 20px}
.filter-bar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.f-item{display:flex;align-items:center;gap:6px;font-size:14px}
.f-item label{color:var(--ink2);white-space:nowrap}
select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0D141B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0D141B}}
.ms{position:relative}
.ms-btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 10px;min-width:120px;text-align:left}
.ms-pop{position:absolute;top:calc(100% + 4px);left:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;z-index:40;min-width:200px;max-height:320px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.ms-pop label{display:flex;gap:8px;padding:4px 6px;border-radius:6px;font-size:14px;cursor:pointer}
.ms-pop label:hover{background:var(--surface2)}
.ms-pop .ms-tools{display:flex;gap:6px;margin-bottom:6px}
.ms-pop .ms-tools button{font-size:12.5px;padding:3px 8px}
.denom-note{font-size:12.5px;color:var(--ink3)}

main{max-width:1360px;margin:0 auto;padding:16px 20px 60px}

/* upload */
.drop{border:2px dashed var(--line);border-radius:16px;background:var(--surface);padding:48px 24px;text-align:center;max-width:760px;margin:40px auto}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h2{margin:0 0 8px;font-size:22px}
.drop p{color:var(--ink2);margin:6px auto;max-width:56ch}
.csv-fallback{margin-top:18px;text-align:left;background:var(--warn-bg);border-radius:10px;padding:14px 16px}
.csv-fallback .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
h2.sec{font-size:18px;margin:6px 0 12px}
h3{font-size:16px;margin:0 0 8px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--ink2);font-weight:600;background:var(--surface2);position:sticky;top:0}
table.t td.r,table.t th.r{text-align:right}
table.t th.sortable{cursor:pointer;user-select:none}
.tbl-wrap{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:8px}
.light{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.light::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.light.g{color:var(--ok);background:var(--ok-bg)}.light.y{color:var(--warn);background:var(--warn-bg)}.light.r{color:var(--bad);background:var(--bad-bg)}.light.n{color:var(--ink3);background:var(--surface2)}

/* health */
.health-row td:first-child{font-weight:600}
details.more summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:4px}
.foot-note{margin-top:14px;padding:12px 14px;border-left:4px solid var(--warn);background:var(--warn-bg);border-radius:6px;font-size:14px}

/* mapping */
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.map-row{display:grid;grid-template-columns:140px 1fr 24px;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.map-row select{width:100%}
.req{color:var(--bad)}

/* module chain */
.chain{position:relative;padding-left:30px}
.chain::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;background:var(--line)}
.mod{position:relative;margin-bottom:22px}
.mod-dot{position:absolute;left:-30px;top:2px;min-width:24px;height:24px;padding:0 4px;border-radius:12px;white-space:nowrap;background:var(--surface);border:2px solid var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--accent)}
.mod-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.mod-head h2{font-size:18px;margin:0}
.mod-head .q{color:var(--ink2);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ink3)}
.kpi.g::before{background:var(--ok)}.kpi.y::before{background:var(--warn)}.kpi.r::before{background:var(--bad)}
.kpi:hover{border-color:var(--accent)}
.kpi[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.kpi .k-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.kpi .k-name{font-size:13.5px;color:var(--ink2);line-height:1.35}
.kpi .k-val{font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.kpi .k-val small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:3px}
.kpi .k-sub{font-size:12.5px;color:var(--ink3);min-height:18px}
.kpi .k-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.delta{font-size:12.5px;white-space:nowrap}
.delta.up{color:var(--bad)}.delta.down{color:var(--ok)}.delta.flat{color:var(--ink3)}
.delta.up.good{color:var(--ok)}.delta.down.bad{color:var(--bad)}

/* panel */
.panel-back{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:60;display:flex;justify-content:flex-end}
.panel{background:var(--paper);width:min(1120px,100%);height:100%;overflow:auto;padding:0 0 40px;border-left:1px solid var(--line)}
.panel-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;align-items:center;z-index:2}
.panel-head h2{margin:0;font-size:18px}
.panel-head .close{margin-left:auto;white-space:nowrap}
.panel-body{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.p-sec h3{display:flex;align-items:center;gap:8px}
.p-sec h3 .n{width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px}
.charts{display:grid;grid-auto-flow:row dense;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:14px}
.chart-box{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.chart-box h4{margin:0 0 4px;font-size:14px}
.chart-box .cap{font-size:12.5px;color:var(--ink3);margin:0 0 6px}
.chart-box.wide{grid-column:1/-1}
.chart-scroll{overflow-x:auto}
.chart-scroll svg{min-width:460px}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font-family:inherit;fill:var(--ink2);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin:2px 0 6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.line{height:3px;border-radius:2px;vertical-align:3px}
.formula{font-size:14px}
.formula .f{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.formula .f b{display:block;margin-bottom:2px}
.formula code{font-family:inherit;color:var(--accent)}
ul.diag{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.diag li{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface);display:flex;gap:10px;align-items:flex-start}
ul.diag li .light{margin-top:2px}
.panel-filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;padding:7px 10px;border-radius:7px;z-index:100;max-width:300px;line-height:1.45;white-space:pre-line;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.drill{margin-top:10px}

/* drawer */
.drawer-back{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:70;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(460px,100%);height:100%;overflow:auto;padding:16px 18px 40px}
.drawer h2{margin:0 0 4px;font-size:18px}
.drawer fieldset{border:1px solid var(--line);border-radius:8px;margin:12px 0;padding:8px 12px}
.drawer legend{font-weight:600;font-size:14px;padding:0 4px}
.p-row{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;font-size:13.5px;padding:3px 0}
.p-row input{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface2);text-align:right}

/* report */
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix button.cell{border:0;background:none;padding:0}
.cause{font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.finding{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);margin-bottom:10px}
.finding .fh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.finding .rank{font-weight:700;color:var(--accent)}
.finding dl{display:grid;grid-template-columns:72px 1fr;gap:4px 10px;margin:8px 0 0;font-size:14px}
.finding dt{color:var(--ink3)}
.finding dd{margin:0}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.recs ul{padding-left:18px;margin:6px 0 0}
.recs li{margin-bottom:8px}
.recs li a{color:var(--accent);font-size:13px;cursor:pointer;text-decoration:underline}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;padding:0;font-size:inherit}
.stack{display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-size:14px;z-index:120}

@media (max-width:640px){
  header.top{position:static}
  .panel-head .close{white-space:nowrap}
  .kpis{grid-template-columns:1fr}
  .top-inner{padding:10px 14px}
  main,.filters,nav.tabs{padding-left:14px;padding-right:14px}
  .map-row{grid-template-columns:110px 1fr 20px}
  .chain{padding-left:0}.chain::before,.mod-dot{display:none}
}
@media (prefers-reduced-motion:no-preference){.kpi{transition:border-color .15s}}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header.top,nav.tabs,.filters,.noprint,.panel-back,.drawer-back,.tip,.toast{display:none!important}
  body{background:#fff;color:#000}
  main{max-width:none;padding:0}
  .card,.finding{break-inside:avoid;border-color:#bbb}
  .view:not(.print-me){display:none!important}
}

</style>
</head>
<body>
<header class="top">
 <div class="top-inner">
  <div class="brand"><h1>加班工時診斷儀表板</h1><div class="meta" id="meta"></div></div>
  <span class="local-badge">資料僅在本機處理，不會上傳</span>
  <div class="top-actions">
   <label class="btn primary" for="file-in">上傳 XLSX</label><input type="file" id="file-in" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
   <div class="menu"><button class="btn" data-act="export" data-need-data aria-haspopup="true">匯出 ▾</button>
    <div class="menu-pop hidden" id="export-pop">
     <button data-act="exp" data-key="health">資料健檢結果 CSV</button>
     <button data-act="exp" data-key="m1">模組一 部門趨勢判定 CSV</button>
     <button data-act="exp" data-key="u">未核准加班員工名單 CSV</button>
     <button data-act="exp" data-key="m2">模組二 長期高工時名單 CSV</button>
     <button data-act="exp" data-key="m3">模組三 部門缺口與象限 CSV</button>
     <button data-act="exp" data-key="m4">模組四 優先關注名單 CSV</button>
     <button data-act="exp" data-key="diag">綜合診斷 部門根因 CSV</button>
     <div class="sep"></div>
     <button data-act="param-export">參數設定 JSON</button>
    </div></div>
   <label class="toggle"><input type="checkbox" id="mask-in" checked>遮罩模式</label>
   <button class="btn" data-act="settings">參數設定</button>
   <button class="btn" data-act="theme">主題 自動</button>
  </div>
 </div>
 <nav class="tabs hidden" id="tabs" role="tablist">
  <button role="tab" data-act="tab" data-key="health">資料健檢</button>
  <button role="tab" data-act="tab" data-key="modules">模組分析</button>
  <button role="tab" data-act="tab" data-key="report">綜合診斷</button>
 </nav>
</header>
<div class="filters hidden" id="filters"><div class="filter-bar" id="filter-bar"></div></div>
<main id="main"></main>
<div id="panel-host"></div>
<div id="drawer-host"></div>
<input type="file" id="param-in" accept=".json,application/json" hidden>
<script>
'use strict';
/* ========== 工具 ========== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((s,x)=>s+(+x||0),0);
const mean=a=>a.length?sum(a)/a.length:0;
const median=a=>{if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
const std=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(sum(a.map(x=>(x-m)**2))/a.length)};
const quant=(a,q)=>{if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const p=(b.length-1)*q,lo=Math.floor(p),hi=Math.ceil(p);return b[lo]+(b[hi]-b[lo])*(p-lo)};
function pearson(x,y){const n=x.length;if(n<3)return NaN;const mx=mean(x),my=mean(y);let a=0,b=0,c=0;for(let i=0;i<n;i++){a+=(x[i]-mx)*(y[i]-my);b+=(x[i]-mx)**2;c+=(y[i]-my)**2}return b&&c?a/Math.sqrt(b*c):NaN}
function linreg(y){const n=y.length;if(n<3)return{slope:NaN,r2:NaN,n};const x=y.map((_,i)=>i+1),mx=mean(x),my=mean(y);let sxy=0,sxx=0,syy=0;for(let i=0;i<n;i++){sxy+=(x[i]-mx)*(y[i]-my);sxx+=(x[i]-mx)**2;syy+=(y[i]-my)**2}const slope=sxy/sxx;const r2=syy?(sxy*sxy)/(sxx*syy):0;return{slope,r2,n,intercept:my-slope*mx}}
function gini(v){const n=v.length;if(!n)return 0;const s=sum(v);if(!s)return 0;const b=[...v].sort((x,y)=>x-y);let acc=0;b.forEach((x,i)=>acc+=(i+1)*x);return (2*acc)/(n*s)-(n+1)/n}
function pctRank(arr){const s=[...arr].sort((a,b)=>a-b);return arr.map(v=>{let lo=0,eq=0;for(const x of s){if(x<v)lo++;else if(x===v)eq++}return s.length?((lo+0.5*eq)/s.length)*100:0})}

async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let eocd=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}

  const count=dv.getUint16(eocd+10,true);let p=dv.getUint32(eocd+16,true);
  const td=new TextDecoder('utf-8'),entries={};
  for(let n=0;n<count;n++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('ZIP 中央目錄格式錯誤');
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nlen=dv.getUint16(p+28,true),elen=dv.getUint16(p+30,true),clen=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nlen));entries[name]={method,csize,lho};p+=46+nlen+elen+clen;
  }
  async function read(name){
    const e=entries[name]||entries[Object.keys(entries).find(k=>k.toLowerCase()===name.toLowerCase())];if(!e)return null;
    const ln=dv.getUint16(e.lho+26,true),le=dv.getUint16(e.lho+28,true),start=e.lho+30+ln+le;
    const data=u8.subarray(start,start+e.csize);
    if(e.method===0)return td.decode(data);
    if(e.method!==8)throw new Error('不支援的壓縮方式：'+e.method);
    const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return td.decode(await new Response(stream).arrayBuffer());
  }
  return {entries,read};
}
const colIdx=ref=>{const m=/^([A-Z]+)/.exec(ref);let n=0;for(const c of m[1])n=n*26+(c.charCodeAt(0)-64);return n-1};
async function parseXLSX(buf){

    const xfs=st.getElementsByTagName('cellXfs')[0];if(xfs){Array.from(xfs.getElementsByTagName('xf')).forEach((xf,i)=>{const id=+xf.getAttribute('numFmtId');const code=custom[id]||'';if((id>=14&&id<=22)||(id>=45&&id<=47)||/[ymd]/i.test(code.replace(/\[[^\]]*\]|"[^"]*"/g,'')))dateStyles.add(i)})}}

    const name=s.getAttribute('name'),rid=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let target=relMap[rid]||'';target=target.startsWith('/')?target.slice(1):'xl/'+target.replace(/^\.\//,'');
    const doc=await xml(target);if(!doc)continue;const rows=[];

      const arr=[];

        const ref=c.getAttribute('r'),t=c.getAttribute('t'),sIdx=+(c.getAttribute('s')||0);const i=ref?colIdx(ref):arr.length;
        const vEl=c.getElementsByTagName('v')[0];let v=vEl?vEl.textContent:null;
        if(t==='s')v=ss[+v]??'';else if(t==='inlineStr'){v=Array.from(c.getElementsByTagName('t')).map(x=>x.textContent).join('')}
        else if(t==='b')v=v==='1';else if(t==='str'||t==='e'){}
        else if(v!=null&&v!==''){v=+v;if(dateStyles.has(sIdx))v={__date:v}}

function parseCSV(text){
  text=text.replace(/^\ufeff/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x!==''));
}
function excelDate(v){
  if(v==null||v==='')return '';
  if(typeof v==='object'&&v.__date!=null)v=v.__date;
  if(typeof v==='number'||/^\d+(\.\d+)?$/.test(String(v))){const n=+v;if(n>20000&&n<80000){const d=new Date(Date.UTC(1899,11,30)+Math.round(n*86400000));return d.toISOString().slice(0,10)}}
  const s=String(v).trim().replace(/\//g,'-');const m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:s;
}

const norm=s=>String(s??'').normalize('NFKC').replace(/[\s_\-()（）［］\[\]：:]/g,'').toLowerCase();
function headerOf(sheet){for(const r of sheet.rows){if(r&&r.filter(x=>x!=null&&x!=='').length>=2)return r.map(x=>String(x??'').trim())}return[]}
function matchField(headers,syn){
  const nh=headers.map(norm);
  for(const s of syn){const i=nh.indexOf(norm(s));if(i>=0)return i}
  for(const s of syn){const ns=norm(s);if(ns.length<2)continue;const i=nh.findIndex(h=>h&&(h.includes(ns)||ns.includes(h)&&h.length>=2));if(i>=0)return i}
  return -1;
}
function autoMap(sheets){
  const res={};const used=new Set();
  for(const [role,def] of Object.entries(ROLES)){
    let si=sheets.findIndex((s,i)=>!used.has(i)&&def.names.some(n=>norm(s.name)===norm(n)));
    if(si<0)si=sheets.findIndex((s,i)=>!used.has(i)&&def.names.some(n=>norm(s.name).includes(norm(n))));
    if(si<0){// 以欄位簽章判斷
      let best=-1,bs=0;sheets.forEach((s,i)=>{if(used.has(i))return;const h=headerOf(s);const sc=def.fields.filter(f=>f[2]&&matchField(h,f[3])>=0).length/def.fields.filter(f=>f[2]).length;if(sc>bs){bs=sc;best=i}});
      if(bs>=0.99)si=best;
    }
    if(si>=0)used.add(si);
    res[role]={sheet:si,auto:si>=0,cols:{}};
    if(si>=0)fillCols(res[role],sheets[si],def);
  }
  return res;
}
function fillCols(m,sheet,def){const h=headerOf(sheet);m.cols={};for(const f of def.fields)m.cols[f[0]]=matchField(h,f[3])}

    action:bad2.length?'保留原值，不影響加班計算；異常缺勤率改用工作日數 × 8 為分母':'無需處理',mods:'模組四',
    detail:bad2.slice(0,40).map(r=>`${r.emp} ${ymLabel(r.ym)}：記錄 ${r.nh}，應為 ${r.wd*8-r.lv-r.ab}`)});

    action:bad3.length?'未核准時數以 0 計，不出現負值':'無需處理',mods:'未核准加班',detail:bad3.slice(0,40).map(r=>`${r.emp} ${ymLabel(r.ym)}：實際 ${r.ot}，核准 ${r.ota}`)});
  // 4 人力缺口

    if(isFinite(v.sa)&&v.sa!==j.act)bad6.push(`${dn(d)}：年初實際 ${v.sa}，編制表 ${ymLabel(j.ym)} 為 ${j.act}`);
    if(isFinite(v.sq)&&v.sq!==j.quota)bad6.push(`${dn(d)}：年初編制 ${v.sq}，編制表 ${ymLabel(j.ym)} 為 ${j.quota}`)});

/* ========== 分析引擎 ========== */
function analyze(){
  const {H,ST,months,staffMap}=S.data;const P=S.params,f=S.f;
  const ms=months.filter(m=>m>=f.start&&m<=f.end);
  const depts=S.data.depts.filter(d=>f.depts.has(d));
  const F=H.filter(r=>r.ym>=f.start&&r.ym<=f.end&&f.depts.has(r.dept)&&f.jobs.has(r.job));
  const SF=ST.filter(r=>r.ym>=f.start&&r.ym<=f.end&&f.depts.has(r.dept));
  const rec={};F.forEach(r=>{const k=r.dept+'|'+r.ym;(rec[k]=rec[k]||new Set()).add(r.emp)});
  const heads=(d,ym)=>{if(S.denom==='staff'){const s=staffMap[d+'|'+ym];if(s&&isFinite(s.act))return s.act}return rec[d+'|'+ym]?.size||0};
  const headsOf=(ds,yms)=>{let h=0;for(const d of ds)for(const m of yms)h+=heads(d,m);return h};
  // 部門 × 月 彙總
  const A={};depts.forEach(d=>{A[d]={};ms.forEach(m=>A[d][m]={ot:0,ota:0,un:0,lv:0,ab:0,wdh:0,n:0})});
  F.forEach(r=>{const a=A[r.dept]?.[r.ym];if(!a)return;a.ot+=r.ot;a.ota+=r.ota;a.un+=Math.max(0,r.ot-r.ota);a.lv+=r.lv;a.ab+=r.ab;a.wdh+=(isFinite(r.wd)?r.wd*8:0);a.n++});
  const aggOf=(ds,yms,k)=>{let s=0;for(const d of ds)for(const m of yms)s+=A[d]?.[m]?.[k]||0;return s};
  const pcOf=(ds,yms,k='ot')=>{const h=headsOf(ds,yms);return h?aggOf(ds,yms,k)/h:NaN};
  // 季度對照
  const qMap={};F.forEach(r=>{if(!qMap[r.ym])qMap[r.ym]=r.q});ms.forEach(m=>{if(!qMap[m])qMap[m]=qOf(m)});
  const quarters=[...new Set(ms.map(m=>qMap[m]))];const qMonths=q=>ms.filter(m=>qMap[m]===q);
  const periods=f.gran==='q'?quarters.map(q=>({key:q,label:q,months:qMonths(q)})):ms.map(m=>({key:m,label:ymLabel(m),months:[m]}));
  const R={ms,depts,F,SF,periods,quarters,qMonths,qMap,A,heads,headsOf,aggOf,pcOf,nM:ms.length};
  if(!ms.length||!depts.length){R.empty=true;return R}

  /* ---- 模組一 ---- */
  const m1={};m1.total=aggOf(depts,ms,'ot');m1.headsSum=headsOf(depts,ms);m1.avgHeads=m1.headsSum/ms.length;m1.pc=m1.headsSum?m1.total/m1.headsSum:NaN;
  m1.pcM=ms.map(m=>pcOf(depts,[m]));m1.totM=ms.map(m=>aggOf(depts,[m],'ot'));
  m1.pcQ=quarters.map(q=>pcOf(depts,qMonths(q)));m1.totQ=quarters.map(q=>aggOf(depts,qMonths(q),'ot'));
  const n=ms.length;m1.mom=n>=2?(m1.pcM[n-1]-m1.pcM[n-2])/m1.pcM[n-2]:NaN;
  m1.momSeries=m1.pcM.map((v,i)=>i?(v-m1.pcM[i-1])/m1.pcM[i-1]:NaN);
  const nq=quarters.length;m1.qoq=nq>=2?(m1.pcQ[nq-1]-m1.pcQ[nq-2])/m1.pcQ[nq-2]:NaN;

    const pcM=ms.map(m=>pcOf([d],[m])),valid=pcM.filter(isFinite);const pcQ=quarters.map(q=>pcOf([d],qMonths(q)));
    const reg=linreg(valid);const N=P.growConsec;let c1=false;
    if(valid.length>=N+1){c1=true;for(let i=valid.length-N;i<valid.length;i++)if(!(valid[i]>valid[i-1]))c1=false}
    const c2=isFinite(reg.slope)&&reg.slope>P.growSlope&&reg.r2>=P.growR2;
    const vq=pcQ.filter(isFinite);const qg=vq.length>=2?(vq[vq.length-1]-vq[vq.length-2])/vq[vq.length-2]:NaN;const c3=isFinite(qg)&&qg>=P.growQoQ;
    const peaks=[];for(let i=1;i<pcQ.length-1;i++){if(pcQ[i]>=pcQ[i-1]*(1+P.peakRise)&&pcQ[i+1]<=pcQ[i]*(1-P.peakFall))peaks.push({q:quarters[i],v:pcQ[i],prev:pcQ[i-1],next:pcQ[i+1]})}
    const tot=aggOf([d],ms,'ot'),hs=headsOf([d],ms);
    // 前後期分解

    const totA=aggOf([d],a,'ot')/a.length,totB=aggOf([d],b,'ot')/b.length,hA=headsOf([d],a)/a.length,hB=headsOf([d],b)/b.length;
    const pcA=hA?totA/hA:NaN,pcB=hB?totB/hB:NaN;
    const dec={totChg:totA?(totB-totA)/totA:NaN,pcChg:pcA?(pcB-pcA)/pcA:NaN,hChg:hA?(hB-hA)/hA:NaN,hA,hB,pcA,pcB,from:nq>=2?quarters[0]:ymLabel(ms[0]),to:nq>=2?quarters[nq-1]:ymLabel(ms[n-1])};
    dec.headShare=(pcA>0&&pcB>0&&hA>0&&hB>0&&pcB!==pcA)?-Math.log(hB/hA)/Math.log(pcB/pcA):NaN;
    dec.type=(dec.pcChg>0.10&&dec.hChg<-0.03)?'attrition':(dec.totChg>0.10&&Math.abs(dec.pcChg)<0.05&&dec.hChg>0)?'heads':null;
    const firstQ=pcQ[0];const laterHigher=pcQ.length>=2&&pcQ.slice(1).every(v=>v>firstQ*1.1);
    return{d,pcM,pcQ,reg,c1,c2,c3,qg,growth:c1||c2||c3,peaks,peak:peaks.length>0,tot,avgHeads:hs/ms.length,pc:hs?tot/hs:NaN,fte:tot/(ms.length*P.stdHours),dec,laterHigher};
  });
  m1.growDepts=m1.dept.filter(x=>x.growth);
  // 全公司分解
  {let a,b;if(nq>=2){a=qMonths(quarters[0]);b=qMonths(quarters[nq-1])}else{a=[ms[0]];b=[ms[n-1]]}
   const tA=aggOf(depts,a,'ot')/a.length,tB=aggOf(depts,b,'ot')/b.length,hA=headsOf(depts,a)/a.length,hB=headsOf(depts,b)/b.length;
   m1.dec={totChg:(tB-tA)/tA,pcChg:(tB/hB-tA/hA)/(tA/hA),hChg:(hB-hA)/hA,from:nq>=2?quarters[0]:ymLabel(ms[0]),to:nq>=2?quarters[nq-1]:ymLabel(ms[n-1])}}
  R.m1=m1;

  /* ---- 未核准 ---- */
  const u={};u.total=aggOf(depts,ms,'un');u.ratio=m1.total?u.total/m1.total:NaN;
  u.unM=ms.map(m=>aggOf(depts,[m],'un'));u.ratioM=ms.map((m,i)=>m1.totM[i]?u.unM[i]/m1.totM[i]:NaN);
  u.dept=depts.map(d=>{const ot=aggOf([d],ms,'ot'),un=aggOf([d],ms,'un');return{d,ot,un,ratio:ot?un/ot:NaN}});
  u.flag=u.dept.filter(x=>u.ratio>0&&x.ratio>u.ratio*P.unapMult);
  const ue={};F.forEach(r=>{const k=r.emp;ue[k]=ue[k]||{emp:k,dept:r.dept,job:r.job,ot:0,un:0};ue[k].ot+=r.ot;ue[k].un+=Math.max(0,r.ot-r.ota)});
  u.emps=Object.values(ue).sort((a,b)=>b.un-a.un);R.u=u;

  /* ---- 模組二 ---- */
  const EM={};F.forEach(r=>{const e=EM[r.emp]=EM[r.emp]||{emp:r.emp,dept:r.dept,job:r.job,ot:0,lv:0,ab:0,mon:{},pj:[],ld:[]};
    e.ot+=r.ot;e.lv+=r.lv;e.ab+=r.ab;e.dept=r.dept;e.mon[r.ym]={ot:r.ot,lv:r.lv,ab:r.ab,ld:r.ld,pj:r.pj,ota:r.ota};if(isFinite(r.pj))e.pj.push(r.pj);if(isFinite(r.ld))e.ld.push(r.ld)});
  const emps=Object.values(EM);
  const m2={};const sorted=[...emps].sort((a,b)=>b.ot-a.ot);const tot=sum(sorted.map(e=>e.ot));m2.n=sorted.length;m2.sorted=sorted;m2.total=tot;
  m2.k=Math.max(1,Math.ceil(m2.n*P.topPct));m2.topShare=tot?sum(sorted.slice(0,m2.k).map(e=>e.ot))/tot:NaN;
  let acc=0,cut=0;for(let i=0;i<sorted.length;i++){acc+=sorted[i].ot;if(acc>=P.paretoPct*tot-1e-9){cut=i+1;break}}m2.cutN=cut;m2.cut=m2.n?cut/m2.n:NaN;
  m2.gini=gini(sorted.map(e=>e.ot));
  m2.giniLevel=m2.gini>=P.giniVery?'高度集中':m2.gini>=P.giniHigh?'偏高集中':m2.gini>=P.giniMid?'中度集中':'分布平均';
  m2.cv=depts.map(d=>{const v=F.filter(r=>r.dept===d).map(r=>r.ot);const m=mean(v);return{d,cv:m?std(v)/m:NaN,n:v.length,mean:m,vals:v}});
  m2.cvHigh=m2.cv.filter(x=>x.cv>P.cvThr);
  emps.forEach(e=>{
    const ks=Object.keys(e.mon).map(Number).sort((a,b)=>a-b);const seq=ks.map(k=>({i:ymIdx(k),v:e.mon[k].ot,ym:k}));
    let lv=0;const reasons=[];const mx=Math.max(...seq.map(x=>x.v));
    e.exceed=seq.filter(x=>x.v>P.t1Month).length;e.exceedMonths=seq.filter(x=>x.v>P.t1Month).map(x=>x.ym);
    if(mx>P.t1Month){lv=1;reasons.push(`單月最高 ${fmt(mx)} 小時`)}
    const runs=[];for(let i=0;i<seq.length;i++){let j=i;while(j+1<seq.length&&seq[j+1].i===seq[j].i+1)j++;runs.push(seq.slice(i,j+1));i=j}
    let s3=0,best=0;for(const r of runs){for(let i=0;i+2<r.length;i++)s3=Math.max(s3,r[i].v+r[i+1].v+r[i+2].v);for(let L=2;L<=6;L++)for(let i=0;i+L<=r.length;i++)best=Math.max(best,mean(r.slice(i,i+L).map(x=>x.v)))}
    if(s3>P.t2Sum3||mx>P.t2Month){lv=Math.max(lv,2);if(s3>P.t2Sum3)reasons.push(`連續 3 月合計 ${fmt(s3)} 小時`)}
    if(mx>P.t3Month||best>P.t3Avg){lv=3;if(best>P.t3Avg)reasons.push(`連續月平均 ${fmt(best)} 小時`)}
    e.tier=lv;e.tierReason=reasons.join('，');e.s3=s3;e.bestAvg=best;e.maxM=mx;
  });
  m2.tiers=[1,2,3].map(t=>emps.filter(e=>e.tier===t).length);m2.longCount=emps.filter(e=>e.tier>=1).length;
  m2.longEmps=emps.filter(e=>e.tier>=1).sort((a,b)=>b.tier-a.tier||b.exceed-a.exceed||b.ot-a.ot);

  const gapAt=(ds,m)=>{let g=0,o=0,q=0,a=0,c=0;ds.forEach(d=>{const s=st(d,m);if(!s)return;c++;g+=Math.max(0,s.quota-s.act);o+=Math.max(0,s.act-s.quota);q+=s.quota;a+=s.act});return{g,o,q,a,c}};
  m3.byMonth=ms.map(m=>({m,...gapAt(depts,m)}));const L=m3.byMonth[n-1];

    const ds=m1.dept.find(x=>x.d===d);const avgGap=mean(gaps);const gapM=ms.map(m=>{const s=st(d,m);return s?Math.max(0,s.quota-s.act):NaN});
    const rateM=ms.map(m=>{const s=st(d,m);return s&&s.quota?Math.max(0,s.quota-s.act)/s.quota:NaN});
    // 滯後相關：缺口(t-1) vs 人均(t)

  m2.imbalance.forEach(x=>out.push({l:'r',tag:'imbalance',d:x.d,score:3,text:`${DN(x.d)} 部門內員工月加班變異係數 ${fmt(x.cv,2)}（門檻 ${P.cvThr}）${m2.gini<P.giniHigh?'，全公司集中度不高但部門內分工失衡':''}，負擔最重的是 ${x.top.map(e=>`${esc(empLabel(e.emp))} ${fmt(e.ot)} 小時`).join('、')}。`}));
  if(m2.chronic.length){const t=m2.chronic[0];out.push({l:'r',tag:'chronic',score:4,text:`${m2.chronic.length} 位員工單月加班超過 ${P.t1Month} 小時的月數達 ${P.longMonths} 個月以上，最多為 ${EL(t)} 共 ${t.exceed} 個月，判定為長期高工時。`})}
  if(m2.tiers[2])out.push({l:'r',tag:'tier3',score:5,text:`有 ${m2.tiers[2]} 位員工達第三級（單月 > ${P.t3Month} 小時或連續 2–6 月平均 > ${P.t3Avg} 小時），屬高度健康風險。`});
  else if(m2.tiers[1])out.push({l:'r',tag:'chronic',score:3,text:`有 ${m2.tiers[1]} 位員工達第二級（連續 3 月合計 > ${P.t2Sum3} 小時或單月 > ${P.t2Month} 小時）。`});
  if(m2.longCount)out.push({l:'y',tag:null,score:1,text:`共有 ${m2.longCount} 位員工曾超過第一級門檻（單月 > ${P.t1Month} 小時），涉及 ${R.F.filter(r=>r.ot>P.t1Month).length} 筆員工月紀錄。`});
  m2.masked.forEach(x=>out.push({l:'y',tag:'masked',d:x.d,score:2,text:`${DN(x.d)} 人均 ${fmt(x.pc)} 小時不高於全公司 ${fmt(R.m1.pc)} 小時，但有 ${x.emps.length} 位員工超過第一級門檻（${x.emps.slice(0,3).map(e=>esc(empLabel(e.emp))).join('、')}），屬平均數掩蓋個人過勞。`}));
  out.push({l:'n',tag:null,score:0,text:'高工時分級門檻參考台灣勞基法第 32 條與職業促發腦心血管疾病認定參考指引，僅供管理參考，實際適用以最新法規與勞資協議為準。'});
  return out.sort((a,b)=>b.score-a.score);
}
const QN={HH:'結構性人力不足',LH:'流程或分配問題',HL:'業務量下降或編制偏高',LL:'健康'};
function diagM3(R){const P=S.params,m3=R.m3,out=[];
  m3.dept.forEach(x=>{if(!x.quad)return;const t=`${DN(x.d)} 缺口率 ${pct(x.rate)}、人均加班 ${fmt(x.pc)} 小時（中位數 ${pct(m3.xm)}、${fmt(m3.ymed)} 小時）`;
    if(x.quad==='HH')out.push({l:'r',tag:'struct',d:x.d,score:3+(x.rate>=P.gapRed?1:0),text:`${t}，落在高缺口高加班象限，判定為結構性人力不足，建議優先補人。`});
    if(x.quad==='LH')out.push({l:'y',tag:'process',d:x.d,score:2,text:`${t}，落在低缺口高加班象限，判定為流程或分配問題，請到模組二確認部門內分工。`});
    if(x.quad==='HL')out.push({l:'y',tag:'overquota',d:x.d,score:1.5,text:`${t}，落在高缺口低加班象限，業務量可能下降或編制偏高，建議檢討編制。`});
    if(x.quad==='LL')out.push({l:'g',tag:null,d:x.d,score:0,text:`${t}，落在低缺口低加班象限，判定為健康。`});
    if(isFinite(x.replace)&&x.replace>P.replaceThr)out.push({l:'r',tag:'replace',d:x.d,score:2.5,text:`${DN(x.d)} 加班換算 ${fmt(x.fte,2)} 人，平均缺口 ${fmt(x.avgGap,1)} 人，加班替補比 ${fmt(x.replace,2)}，加班正在大量替補空缺。`});});
  if(isFinite(m3.r))out.push({l:m3.r>=0.5?'r':m3.r>=0.3?'y':'g',tag:m3.r>=0.3?'corr':null,score:m3.r>=0.3?2:0,text:`部門缺口率與人均加班的相關係數 r = ${fmt(m3.r,2)}，${m3.r>=0.5?'呈明顯正相關':m3.r>=0.3?'呈中度正相關':m3.r>0?'正相關偏弱':'沒有正相關'}${m3.n<10?`。樣本僅 ${m3.n} 個部門，相關係數僅供方向參考`:''}。`});
  if(isFinite(m3.lagCo))out.push({l:'n',tag:null,score:0,text:`全公司缺口人數領先 1 個月與人均加班的滯後相關 r = ${fmt(m3.lagCo,2)}（月份數少時僅供參考）。`});
  if(S.health.gapMismatch)out.push({l:'n',tag:'data',score:0,text:`原始「人力缺口」欄位有 ${S.health.gapMismatch} 筆與重算值不同，可能經脫敏擾動或採不同定義，本模組一律採用重算值。`});
  return out.sort((a,b)=>b.score-a.score);
}
function diagM4(R){const P=S.params,m4=R.m4,out=[];const L=(arr,k=5)=>arr.slice(0,k).map(EL).join('、')+(arr.length>k?` 等 ${arr.length} 人`:'');
  if(m4.pat.burnout.length)out.push({l:'r',tag:'burnout',score:5,text:`耗竭警訊 ${m4.pat.burnout.length} 人，加班位於前 ${100-P.highPct}% 且後半期月均請假增加 ${P.leaveRise} 小時以上：${L(m4.pat.burnout)}，最優先關懷。`});
  if(m4.pat.preburn.length)out.push({l:'y',tag:'preburn',score:3,text:`過勞前兆 ${m4.pat.preburn.length} 人，加班偏高卻幾乎不請假（請假位於後 ${P.lowPct}%）：${L(m4.pat.preburn)}，可能不敢或無法休假。`});
  m4.morale.forEach(x=>out.push({l:'r',tag:'morale',d:x.d,score:3.5,text:`${DN(x.d)} 有 ${x.up.length} 位員工（${pct(x.up.length/x.n,0)}）後半期月均異常缺勤增加 ${P.absRise} 小時以上，判定為部門層級的管理或士氣問題。`}));
  if(m4.pat.discipline.length)out.push({l:'y',tag:'discipline',score:2.5,text:`出勤紀律或個人狀況 ${m4.pat.discipline.length} 人，加班不高但異常缺勤偏高：${L(m4.pat.discipline)}。`});
  if(m4.pat.hidden.length)out.push({l:'y',tag:'hidden',score:2,text:`負荷可能以未申報形式存在 ${m4.pat.hidden.length} 人，工作負荷指數偏高但加班偏低：${L(m4.pat.hidden)}，請對照未核准加班分析。`});
  if(isFinite(m4.lag))out.push({l:m4.lag>=0.6?'r':m4.lag>=0.4?'y':'g',tag:m4.lag>=0.6?'lag':null,score:m4.lag>=0.6?2:0,text:`可評估的 ${m4.lagN} 位員工中，${m4.lagUp} 人（${pct(m4.lag)}）在個人加班最高月份後 1 到 2 個月的請假高於本人平均。`});
  if(isFinite(m4.loadCorr))out.push({l:m4.loadCorr>=0.5?'g':m4.loadCorr>=0.2?'y':'r',tag:m4.loadCorr<0.2?'loadmis':null,score:m4.loadCorr<0.2?2:0,text:`工作負荷指數與實際加班的相關係數 ${fmt(m4.loadCorr,2)}，兩個負荷指標${m4.loadCorr>=0.5?'方向一致':m4.loadCorr>=0.2?'部分一致':'不一致，需檢討指標定義或申報落實度'}。`});
  out.push({l:m4.priority.length?'y':'g',tag:null,score:1,text:`風險分數 ≥ ${P.riskThr} 的優先關注員工 ${m4.priority.length} 人，占 ${pct(m4.priority.length/(R.emps.length||1))}。`});
  return out.sort((a,b)=>b.score-a.score);
}
function recsFrom(diags){const seen=new Set(),out=[];diags.forEach(d=>{if(d.tag&&REC[d.tag]&&!seen.has(d.tag)){seen.add(d.tag);out.push({tier:REC[d.tag][0],text:REC[d.tag][1],tag:d.tag})}});
  if(!out.length)out.push({tier:'long',text:'目前指標在正常範圍，維持每月追蹤即可。'});return out}

const MODS=[
 {id:'m1',no:'1',name:'加班工時與趨勢',q:'負荷在哪個部門、哪個時間點惡化？',kpis:['m1_total','m1_pc','m1_mom','m1_qoq','m1_grow','m1_fte']},
 {id:'u',no:'1-2',name:'未核准加班',q:'加班有沒有被制度看見？',kpis:['u_hours','u_ratio']},
 {id:'m2',no:'2',name:'員工加班集中度',q:'加班是否集中在少數人身上？',kpis:['m2_top','m2_cut','m2_gini','m2_cv','m2_long','m2_topemp']},
 {id:'m3',no:'3',name:'人力配置與缺口',q:'加班是否來自編制缺口？',kpis:['m3_gap','m3_rate','m3_fill','m3_corr','m3_rep']},
 {id:'m4',no:'4',name:'出勤異常與工作負荷',q:'是否已出現耗竭或出勤紀律問題？',kpis:['m4_lv','m4_ab','m4_absrate','m4_risk','m4_pri','m4_lag','m4_lc']}
];
function kpiDef(id,R){const P=S.params,ps=R.periodSeries,m1=R.m1,u=R.u,m2=R.m2,m3=R.m3,m4=R.m4,PS=k=>ps.map(p=>p[k]);
  const lastLbl=ps.length?ps[ps.length-1].label:'',d=ps.length>=2;
  switch(id){
  case 'm1_total':{const s=PS('ot'),c=d?s[s.length-1]/s[s.length-2]-1:NaN,[l,t]=byChg(c,P);return{name:'總加班時數',val:fmt0(m1.total),unit:'小時',sub:`${R.nM} 個月、${R.depts.length} 個部門`,series:s,delta:'pct',l,t}}
  case 'm1_pc':{const l=m1.pc>=P.pcRed?'r':m1.pc>=P.pcYellow?'y':'g';return{name:'人均月加班時數',val:fmt(m1.pc),unit:'小時',sub:`平均人數 ${fmt(m1.avgHeads,1)}`,series:PS('pc'),delta:'pct',l,t:{r:'偏高',y:'留意',g:'正常'}[l]}}
  case 'm1_mom':{const [l,t]=byChg(m1.mom,P);const n=R.ms.length;return{name:'人均月增率',val:pct(m1.mom),unit:'',sub:n>=2?`${ymLabel(R.ms[n-1])} 對 ${ymLabel(R.ms[n-2])}`:'需兩個月以上',series:m1.momSeries,delta:'pp',l,t}}
  case 'm1_qoq':{const [l,t]=byChg(m1.qoq,P);const q=R.quarters;return{name:'人均季增率',val:pct(m1.qoq),unit:'',sub:q.length>=2?`${q[q.length-1]} 對 ${q[q.length-2]}`:'需兩季以上',series:m1.qoqSeries,delta:'pp',l,t}}
  case 'm1_grow':{const k=m1.growDepts.length;return{name:'持續成長部門數',val:k,unit:'個',sub:k?m1.growDepts.map(x=>dn(x.d)).join('、'):'無',series:PS('pc'),delta:null,l:k>=2?'r':k?'y':'g',t:k?'有部門惡化':'未發現'}}
  case 'm1_fte':{const r=m1.fte/m1.avgHeads,l=r>=P.pcRed/P.stdHours?'r':r>=P.pcYellow/P.stdHours?'y':'g';return{name:'加班換算人力',val:fmt(m1.fte,1),unit:'人',sub:`約等於平均人數的 ${pct(r)}`,series:PS('fte'),delta:'pct',l,t:{r:'偏高',y:'留意',g:'正常'}[l]}}
  case 'u_hours':case 'u_ratio':{const l=u.ratio>=P.unapRed?'r':u.ratio>=P.unapYellow?'y':'g',t={r:'合規風險',y:'留意',g:'正常'}[l];
    return id==='u_hours'?{name:'未核准加班時數',val:fmt0(u.total),unit:'小時',sub:`${u.flag.length} 個部門高於全公司 ${P.unapMult} 倍`,series:PS('un'),delta:'pct',l,t}:{name:'未核准加班比率',val:pct(u.ratio),unit:'',sub:`最高 ${u.dept.length?dn([...u.dept].sort((a,b)=>b.ratio-a.ratio)[0].d):'—'}`,series:PS('unR'),delta:'pp',l,t}}
  case 'm2_top':{const l=m2.topShare>=0.5?'r':m2.topShare>=0.35?'y':'g';return{name:`前 ${pct(P.topPct,0)} 員工加班占比`,val:pct(m2.topShare),unit:'',sub:`前 ${m2.k} 人／共 ${m2.n} 人`,series:PS('top'),delta:'pp',l,t:{r:'高度集中',y:'中度集中',g:'分散'}[l]}}
  case 'm2_cut':{const l=m2.cut<=0.35?'r':m2.cut<=0.5?'y':'g';return{name:`柏拉圖 ${pct(P.paretoPct,0)} 切點`,val:pct(m2.cut),unit:'',sub:`${m2.cutN} 人貢獻 ${pct(P.paretoPct,0)} 加班`,series:PS('cut'),delta:'pp',down:true,l,t:{r:'高度集中',y:'中度集中',g:'分散'}[l]}}
  case 'm2_gini':{const l=m2.gini>=P.giniHigh?'r':m2.gini>=P.giniMid?'y':'g';return{name:'加班吉尼係數',val:fmt(m2.gini,3),unit:'',sub:'以員工期間累計加班計算',series:PS('gini'),delta:'abs3',l,t:m2.giniLevel}}
  case 'm2_cv':{const k=m2.cvHigh.length,top=[...m2.cv].sort((a,b)=>b.cv-a.cv)[0];return{name:'負荷不均部門數',val:k,unit:'個',sub:top?`最高 ${dn(top.d)} CV ${fmt(top.cv,2)}`:'',series:PS('cvc'),delta:'abs',l:k>=3?'r':k?'y':'g',t:k?`CV > ${P.cvThr}`:'均衡'}}
  case 'm2_long':{const l=(m2.tiers[1]||m2.tiers[2])?'r':m2.tiers[0]?'y':'g';return{name:'長期高工時人數',val:m2.longCount,unit:'人',sub:`第一級 ${m2.tiers[0]}、第二級 ${m2.tiers[1]}、第三級 ${m2.tiers[2]}`,series:PS('t1'),delta:'abs',l,t:{r:'有第二級以上',y:'有第一級',g:'無'}[l]}}
  case 'm2_topemp':{const e=m2.topEmp;const l=!e?'n':e.exceed>=P.longMonths?'r':e.exceed?'y':'g';return{name:'超標月數最多員工',val:e?e.exceed:'—',unit:'個月',sub:e?`${empLabel(e.emp)}，${dn(e.dept)}`:'',series:e?R.ms.map(m=>e.mon[m]?e.mon[m].ot:NaN):[],delta:null,l,t:{r:'長期高工時',y:'曾超標',g:'未超標',n:'無資料'}[l]}}
  case 'm3_gap':case 'm3_rate':{const l=m3.rate>=P.gapRed?'r':m3.rate>=P.gapYellow?'y':'g',t={r:'缺口大',y:'有缺口',g:'正常'}[l];

  case 'm3_fill':{const l=m3.fill>=1-P.gapYellow?'g':m3.fill>=1-P.gapRed?'y':'r';return{name:'編制達成率',val:pct(m3.fill),unit:'',sub:`在職 ${fmt0(m3.last.a)}／編制 ${fmt0(m3.last.q)}`,series:PS('fill'),delta:'pp',down:true,l,t:{r:'不足',y:'略低',g:'足額'}[l]}}
  case 'm3_corr':{const r=m3.r,l=!isFinite(r)?'n':r>=0.5?'r':r>=0.3?'y':'g';return{name:'缺口率與人均加班相關',val:fmt(r,2),unit:'',sub:`n = ${m3.n} 個部門${m3.n<10?'，僅供方向參考':''}`,series:PS('rate'),delta:null,l,t:{r:'強正相關',y:'中度正相關',g:'關聯弱',n:'樣本不足'}[l]}}
  case 'm3_rep':{const k=m3.dept.filter(x=>isFinite(x.replace)&&x.replace>P.replaceThr).length,v=m3.replace,l=!isFinite(v)?'g':v>P.replaceThr?'r':v>P.replaceThr*0.6?'y':'g';return{name:'加班替補比',val:isFinite(v)?fmt(v,2):'無缺口',unit:'',sub:`${k} 個部門 > ${P.replaceThr}`,series:PS('replace'),delta:'abs2',l,t:{r:'大量替補',y:'部分替補',g:'正常'}[l]}}
  case 'm4_lv':{const s=PS('lv'),c=d?s[s.length-1]/s[s.length-2]-1:NaN,[l,t]=byChg(c,P);return{name:'人均月請假時數',val:fmt(m4.lvPc),unit:'小時',sub:'請假時數 ÷ 人月',series:s,delta:'pct',l,t}}
  case 'm4_ab':{const l=m4.absRate>=P.absRed?'r':m4.absRate>=P.absYellow?'y':'g';return{name:'人均月異常缺勤時數',val:fmt(m4.abPc,2),unit:'小時',sub:'異常缺勤時數 ÷ 人月',series:PS('ab'),delta:'pct',l,t:{r:'偏高',y:'留意',g:'正常'}[l]}}
  case 'm4_absrate':{const l=m4.absRate>=P.absRed?'r':m4.absRate>=P.absYellow?'y':'g',top=[...m4.dept].sort((a,b)=>b.rate-a.rate)[0];return{name:'異常缺勤率',val:pct(m4.absRate,2),unit:'',sub:top?`最高 ${dn(top.d)} ${pct(top.rate,2)}`:'',series:PS('absRate'),delta:'pp',l,t:{r:'偏高',y:'留意',g:'正常'}[l]}}
  case 'm4_risk':{const l=m4.pat.burnout.length?'r':m4.pat.preburn.length?'y':'g';return{name:'高負荷風險分數',val:fmt0(m4.topRisk),unit:'分',sub:'風險分數前 10% 員工平均',series:PS('pc'),delta:null,l,t:{r:'有耗竭警訊',y:'有過勞前兆',g:'未見警訊'}[l]}}
  case 'm4_pri':{const sh=m4.priority.length/(R.emps.length||1),l=sh>0.10?'r':sh>0.05?'y':'g';return{name:'優先關注人數',val:m4.priority.length,unit:'人',sub:`分數 ≥ ${P.riskThr}，占 ${pct(sh)}`,series:PS('t1'),delta:null,l,t:{r:'人數多',y:'留意',g:'少'}[l]}}
  case 'm4_lag':{const l=!isFinite(m4.lag)?'n':m4.lag>=0.6?'r':m4.lag>=0.4?'y':'g';return{name:'加班後請假滯後',val:pct(m4.lag),unit:'',sub:`${m4.lagUp}／${m4.lagN} 人高峰後請假高於平均`,series:PS('lv'),delta:null,l,t:{r:'恢復需求高',y:'留意',g:'正常',n:'樣本不足'}[l]}}
  case 'm4_lc':{const r=m4.loadCorr,l=!isFinite(r)?'n':r>=0.5?'g':r>=0.2?'y':'r';return{name:'負荷指數與加班相關',val:fmt(r,2),unit:'',sub:'員工月紀錄 Pearson r',series:PS('lc'),delta:'abs2',l,t:{g:'一致',y:'部分一致',r:'不一致',n:'無資料'}[l]}}
  }
}
function deltaHTML(k){const s=(k.series||[]).filter(isFinite);if(!k.delta||s.length<2)return '<span class="delta flat">— 無前期比較</span>';
  const a=s[s.length-2],b=s[s.length-1];let txt,dv;
  if(k.delta==='pct'){dv=a?b/a-1:NaN;txt=pct(Math.abs(dv))}else if(k.delta==='pp'){dv=b-a;txt=fmt(Math.abs(dv)*100,Math.abs(dv)<0.001?2:1)+' 個百分點'}else if(k.delta==='abs3'){dv=b-a;txt=fmt(Math.abs(dv),3)}else if(k.delta==='abs2'){dv=b-a;txt=fmt(Math.abs(dv),2)}else{dv=b-a;txt=fmt(Math.abs(dv),0)}
  if(!isFinite(dv))return '<span class="delta flat">— 無前期比較</span>';
  const dir=Math.abs(dv)<1e-9?'flat':dv>0?'up':'down';const arrow=dir==='up'?'▲':dir==='down'?'▼':'＝';
  const cls=k.down?(dir==='up'?'up good':dir==='down'?'down bad':'flat'):dir;
  return `<span class="delta ${cls}">${arrow} ${txt}<span class="muted">（較前期）</span></span>`}

const CAUSE={struct:['結構性缺口','var(--bad)'],dist:['分配不均','var(--warn)'],peak:['短期高峰','var(--s6)'],burn:['耗竭風險','var(--bad)'],comp:['流程合規','var(--s3)'],mgmt:['管理問題','var(--s5)'],ok:['健康','var(--ok)']};
function deptDiagnosis(R){const P=S.params;
  return R.depts.map(d=>{
    const a=R.m1.dept.find(x=>x.d===d),u=R.u.dept.find(x=>x.d===d),cv=R.m2.cv.find(x=>x.d===d),g=R.m3.dept.find(x=>x.d===d);
    const de=R.emps.filter(e=>e.dept===d);const burn=de.filter(e=>e.pattern.includes('burnout')),pre=de.filter(e=>e.pattern.includes('preburn')),pri=de.filter(e=>e.risk>=P.riskThr);
    const tier2=de.filter(e=>e.tier>=2),tier1=de.filter(e=>e.tier>=1);const morale=R.m4.morale.find(x=>x.d===d);
    // 各模組燈號
    const L1=a.growth?'r':(a.peak||a.laterHigher||a.pc>=P.pcYellow)?'y':'g';
    const LU=R.u.flag.includes(u)?'r':(u&&u.ratio>R.u.ratio*1.2)?'y':'g';
    const L2=(cv&&cv.cv>P.cvThr)||tier2.length?'r':tier1.length?'y':'g';
    const L3=!g?'n':g.rate>=P.gapRed?'r':g.rate>=P.gapYellow?'y':'g';
    const L4=burn.length||morale?'r':(pre.length||pri.length)?'y':'g';
    // 根因評分（交叉引用各模組）
    const sc={struct:0,dist:0,peak:0,burn:0,comp:0,mgmt:0},ev={struct:[],dist:[],peak:[],burn:[],comp:[],mgmt:[]};
    if(g&&g.quad==='HH'){sc.struct+=3;ev.struct.push(`缺口率 ${pct(g.rate)} 與人均 ${fmt(g.pc)} 小時皆高於中位數`)}
    if(g&&g.rate>=P.gapYellow){sc.struct+=1;if(g.quad!=='HH')ev.struct.push(`缺口率 ${pct(g.rate)}`)}
    if(g&&isFinite(g.replace)&&g.replace>P.replaceThr){sc.struct+=1;ev.struct.push(`加班替補比 ${fmt(g.replace,2)}`)}
    if(a.dec.type==='attrition'){const sh=a.dec.headShare;if(sh>=0.25){sc.struct+=1.5;ev.struct.push(`人數下降推高人均 ${pct(a.dec.pcChg)}（人數因素約占 ${pct(Math.min(1,sh),0)}）`)}}
    const peakOnly=a.peak&&!a.growth;
    if(a.growth){if(g&&g.rate>=P.gapYellow){sc.struct+=1;ev.struct.push('人均持續成長')}else{sc.dist+=1;ev.dist.push('人均持續成長但缺口不大')}}
    if(cv&&cv.cv>P.cvThr){sc.dist+=2.5;ev.dist.push(`部門內 CV ${fmt(cv.cv,2)}`)}
    // 短期高峰會墊高期間平均並造成高峰期個人超標，交叉引用時歸給高峰
    if(peakOnly){sc.peak+=3;ev.peak.push(`${a.peaks.map(p=>`${p.q} 人均 ${fmt(p.v)} 小時，前後季 ${fmt(p.prev)}、${fmt(p.next)}`).join('；')}`);
      if(g&&g.quad==='LH')ev.peak.push('期間平均偏高源自高峰季');
      const pm=new Set(a.peaks.flatMap(p=>R.qMonths(p.q)));const outPk=de.filter(e=>e.exceedMonths.some(m=>!pm.has(m)));
      if(outPk.length){sc.dist+=1;ev.dist.push(`高峰季以外仍有 ${outPk.length} 人超標`)}}
    else{if(g&&g.quad==='LH'){sc.dist+=1.5;ev.dist.push('低缺口卻高加班')}
      if(R.m2.masked.some(x=>x.d===d)){sc.dist+=1;ev.dist.push('平均不高但有個人超標')}}
    if(burn.length){sc.burn+=2+Math.min(2,burn.length);ev.burn.push(`耗竭警訊 ${burn.length} 人`)}
    if(tier2.length){sc.burn+=1;ev.burn.push(`第二級以上高工時 ${tier2.length} 人`)}
    if(pre.length>=2){sc.burn+=1;ev.burn.push(`過勞前兆 ${pre.length} 人`)}
    if(R.u.flag.includes(u)){sc.comp+=3;ev.comp.push(`未核准比率 ${pct(u.ratio)}，為全公司 ${fmt(u.ratio/R.u.ratio,1)} 倍`)}
    if(morale){sc.mgmt+=3.5;ev.mgmt.push(`${morale.up.length} 人異常缺勤同步上升`)}
    const best=Object.entries(sc).sort((x,y)=>y[1]-x[1])[0];const cause=best[1]>=2?best[0]:'ok';
    const second=Object.entries(sc).sort((x,y)=>y[1]-x[1]).filter(([c,v])=>c!==cause&&v>=2).map(([c])=>CAUSE[c][0]);
    return{d,L:{m1:L1,u:LU,m2:L2,m3:L3,m4:L4},cause,score:best[1],evidence:cause==='ok'?['各模組未觸發主要警訊']:ev[cause],second,sc};
  });
}

  const im=R.m2.imbalance;if(im.length)F.push({impact:im.length*5,title:`${im.map(x=>dn(x.d)).join('、')} 部門內分工失衡`,kpi:'m2_cv',evidence:im.map(x=>`${dn(x.d)} CV ${fmt(x.cv,2)}`).join('；')+'。',cause:'同部門員工負荷差異大，問題在任務分配而非總人力。',conf:'中',tags:['imbalance']});

function renderReport(){const R=S.R;if(!R||R.empty)return '<div class="card">目前篩選範圍沒有資料，請調整篩選條件。</div>';

function exportCSV(kind){const R=S.R;if(!R||R.empty)return toast('目前沒有可匯出的資料');let rows,name;const PN={burnout:'耗竭警訊',preburn:'過勞前兆',discipline:'出勤紀律',hidden:'未申報負荷'};
  if(kind==='m1'){name='模組一_部門趨勢判定';rows=[['部門代碼','部門名稱','期間人均月加班','趨勢斜率','R²','條件一連續上升','條件二迴歸','條件三季成長','最近一季成長率','持續成長','短期高峰季度'],...R.m1.dept.map(x=>[x.d,dn(x.d),x.pc.toFixed(2),x.reg.slope.toFixed(3),x.reg.r2.toFixed(3),x.c1?'是':'否',x.c2?'是':'否',x.c3?'是':'否',isFinite(x.qg)?(x.qg*100).toFixed(1)+'%':'',x.growth?'是':'否',x.peaks.map(p=>p.q).join(' ')])]}
  else if(kind==='u'){name='未核准加班員工名單';rows=[[...empCols(),'部門代碼','部門名稱','職務','實際加班','未核准加班','未核准比率'],...R.u.emps.filter(e=>e.un>0).map(e=>[...empVals(e.emp),e.dept,dn(e.dept),e.job,e.ot.toFixed(1),e.un.toFixed(1),(e.un/e.ot*100).toFixed(1)+'%'])]}
  else if(kind==='m2'){name='模組二_長期高工時名單';rows=[[...empCols(),'部門代碼','部門名稱','職務','等級','超標月數','超標月份','單月最高','連續3月合計最高','累計加班','觸發依據'],...R.m2.longEmps.map(e=>[...empVals(e.emp),e.dept,dn(e.dept),e.job,'第'+e.tier+'級',e.exceed,e.exceedMonths.map(ymLabel).join(' '),e.maxM.toFixed(1),e.s3.toFixed(1),e.ot.toFixed(1),e.tierReason])]}
  else if(kind==='m3'){name='模組三_部門缺口與象限';rows=[['部門代碼','部門名稱','期間缺口率','平均缺口人數','平均在職','人均月加班','加班FTE','加班替補比','象限'],...R.m3.dept.map(x=>[x.d,dn(x.d),(x.rate*100).toFixed(1)+'%',x.avgGap.toFixed(2),x.avgAct.toFixed(1),x.pc.toFixed(2),x.fte.toFixed(2),isFinite(x.replace)?x.replace.toFixed(2):x.avgGap>0?'缺口過小不計':'無缺口',QN[x.quad]||''])]}
  else if(kind==='m4'){name='模組四_優先關注名單';rows=[[...empCols(),'部門代碼','部門名稱','職務','累計加班','累計請假','累計異常缺勤','平均工作負荷指數','風險分數','觸發原因'],...[...R.emps].filter(e=>e.risk>=S.params.riskThr).sort((a,b)=>b.risk-a.risk).map(e=>[...empVals(e.emp),e.dept,dn(e.dept),e.job,e.ot.toFixed(1),e.lv.toFixed(1),e.ab.toFixed(1),isFinite(e.avgLd)?e.avgLd.toFixed(1):'',e.risk.toFixed(1),[...e.pattern.map(p=>PN[p]),...e.triggers].join('、')])]}
  else if(kind==='diag'){name='綜合診斷_部門根因';const DD=deptDiagnosis(R);const LN={g:'綠',y:'黃',r:'紅',n:'無'};rows=[['部門代碼','部門名稱','模組一','未核准','模組二','模組三','模組四','主要根因','判定依據'],...DD.map(x=>[x.d,dn(x.d),LN[x.L.m1],LN[x.L.u],LN[x.L.m2],LN[x.L.m3],LN[x.L.m4],CAUSE[x.cause][0],x.evidence.join('、')])]}
  else if(kind==='health'){name='資料健檢結果';rows=[['檢查項目','結果','問題筆數','處理方式','受影響模組'],...S.health.items.map(x=>[x.name,x.result,x.count,x.action,x.mods])]}
  download(`${name}_${ymLabel(R.ms[0]).replace('/','')}-${ymLabel(R.ms[R.ms.length-1]).replace('/','')}.csv`,toCSV(rows),'text/csv;charset=utf-8');toast(`已匯出 ${name}${S.mask?'（遮罩模式）':''}`)}

/* ---- 載入流程 ---- */
async function handleFile(file){
  try{
    if(/\.csv$/i.test(file.name)){toast('單一 CSV 請使用「改用四個 CSV 上傳」');return}
    if(!XLSX_OK){toast('這個瀏覽器不支援 XLSX 解壓縮，請改用 CSV');return}
    const buf=await file.arrayBuffer();S.sheets=await parseXLSX(buf);S.fileName=file.name;
    S.mapping=autoMap(S.sheets);S.view='mapping';S.panel=null;render();
  }catch(e){console.error(e);alert('讀取失敗：'+e.message)}
}
async function loadCSVs(){const ins=$$('[data-csv]');const sheets=[];
  for(const i of ins){if(!i.files[0])continue;const t=await i.files[0].text();sheets.push({name:ROLES[i.dataset.csv].label,rows:parseCSV(t)})}
  if(!sheets.length){$('#csv-status').textContent='請至少選擇一個 CSV';return}
  S.sheets=sheets;S.mapping=autoMap(sheets);S.view='mapping';render()}

/* ---- 事件 ---- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!e.target.closest('.ms'))$$('.ms-pop').forEach(p=>p.classList.add('hidden'));
  if(!e.target.closest('.menu'))$('#export-pop')?.classList.add('hidden');
  if(!t)return;const a=t.dataset.act,k=t.dataset.key;
  if(a==='close-bg'&&e.target!==t)return;if(a==='drawer-bg'&&e.target!==t)return;
  switch(a){
    case 'open':S.panel=k;S.pf={};if(S.view!=='modules'&&S.view!=='report')S.view='modules';render();break;
    case 'close':case 'close-bg':S.panel=null;render();break;
    case 'heat':S.pf.drill=[t.dataset.r,t.dataset.c];renderPanel();break;
    case 'undrill':S.pf.drill=null;renderPanel();break;
    case 'emp':S.pf.emp=k;renderPanel();setTimeout(()=>{const h=[...$$('.panel h4')].find(x=>x.textContent.startsWith('個人月度時間軸'));h&&h.scrollIntoView({behavior:'smooth',block:'center'})},30);break;
    case 'sort':{const i=+k;if(S.pf.sortKey===i)S.pf.sortDir=-(S.pf.sortDir??-1);else{S.pf.sortKey=i;S.pf.sortDir=-1}renderPanel();break}
    case 'exp-pri':exportCSV('m4');break;
    case 'tab':S.view=k;S.panel=null;render();window.scrollTo(0,0);break;
    case 'gran':S.f.gran=k;recompute();break;
    case 'ms':{const p=$('#ms-'+k);const was=p.classList.contains('hidden');$$('.ms-pop').forEach(x=>x.classList.add('hidden'));if(was)p.classList.remove('hidden');break}
    case 'ms-all':S.f[k]=new Set(k==='depts'?S.data.depts:S.data.jobs);recompute();break;
    case 'ms-none':S.f[k]=new Set();recompute();break;
    case 'show-csv':$('#csv-box').classList.remove('hidden');break;
    case 'load-csv':loadCSVs();break;
    case 'confirm-map':buildData();S.view='health';S.R=analyze();render();break;
    case 'reupload':S.view='upload';S.sheets=null;S.mapping=null;S.data=null;render();break;
    case 'export':$('#export-pop').classList.toggle('hidden');break;
    case 'exp':$('#export-pop').classList.add('hidden');exportCSV(k);break;
    case 'settings':renderDrawer(true);break;
    case 'drawer-close':case 'drawer-bg':renderDrawer(false);break;
    case 'param-export':download('加班儀表板參數.json',JSON.stringify(S.params,null,2),'application/json');break;
    case 'param-reset':S.params={...DEFAULT_PARAMS};renderDrawer(true);recompute();break;
    case 'print':S.panel=null;renderPanel();setTimeout(()=>window.print(),50);break;
    case 'theme':{const r=document.documentElement;const cur=r.dataset.theme||'auto';const nx=cur==='auto'?'light':cur==='light'?'dark':'auto';if(nx==='auto')delete r.dataset.theme;else r.dataset.theme=nx;t.textContent={auto:'主題 自動',light:'主題 淺色',dark:'主題 深色'}[nx];break}
  }
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='file-in'&&t.files[0]){await handleFile(t.files[0]);t.value=''}
  else if(t.id==='param-in'&&t.files[0]){try{const o=JSON.parse(await t.files[0].text());for(const k of Object.keys(DEFAULT_PARAMS))if(isFinite(+o[k]))S.params[k]=+o[k];renderDrawer(true);recompute();toast('已匯入參數')}catch(err){alert('參數檔格式錯誤')}t.value=''}
  else if(t.id==='f-start'||t.id==='f-end'){S.f.start=+$('#f-start').value;S.f.end=+$('#f-end').value;if(S.f.start>S.f.end)[S.f.start,S.f.end]=[S.f.end,S.f.start];recompute()}
  else if(t.id==='f-denom'){S.denom=t.value;recompute()}
  else if(t.dataset.ms){const set=S.f[t.dataset.ms];t.checked?set.add(t.value):set.delete(t.value);recompute()}
  else if(t.dataset.pf){S.pf[t.dataset.pf]=t.value;if(t.dataset.pf==='dept')S.pf.drill=null;renderPanel()}
  else if(t.dataset.param){const v=+t.value;if(isFinite(v)){S.params[t.dataset.param]=v;recompute()}}
  else if(t.id==='mask-in'){S.mask=t.checked;render()}
  else if(t.dataset.mapSheet){const role=t.dataset.mapSheet,i=+t.value;S.mapping[role].sheet=i;S.mapping[role].auto=false;if(i>=0)fillCols(S.mapping[role],S.sheets[i],ROLES[role]);else S.mapping[role].cols={};render()}
  else if(t.dataset.mapCol){const [role,f]=t.dataset.mapCol.split('|');S.mapping[role].cols[f]=+t.value;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#drawer-host').innerHTML)renderDrawer(false);else if(S.panel){S.panel=null;render()}}});
document.addEventListener('dragover',e=>{e.preventDefault();$('#drop')?.classList.add('over')});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('#drop')?.classList.remove('over')});
document.addEventListener('drop',e=>{e.preventDefault();$('#drop')?.classList.remove('over');const f=e.dataTransfer.files[0];if(f)handleFile(f)});
/* 懸停提示框 */
const tip=document.createElement('div');tip.className='tip hidden';tip.setAttribute('role','tooltip');document.body.appendChild(tip);
function showTip(el,x,y){tip.textContent=el.getAttribute('data-tip');tip.classList.remove('hidden');const w=tip.offsetWidth,h=tip.offsetHeight;let L=x+14,Tp=y+14;if(L+w>innerWidth-8)L=x-w-14;if(Tp+h>innerHeight-8)Tp=y-h-14;tip.style.left=Math.max(4,L)+'px';tip.style.top=Math.max(4,Tp)+'px'}
document.addEventListener('mousemove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else tip.classList.add('hidden')});
document.addEventListener('touchstart',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el){const t=e.touches[0];showTip(el,t.clientX,t.clientY)}else tip.classList.add('hidden')},{passive:true});
document.addEventListener('scroll',()=>tip.classList.add('hidden'),true);
render();

let rsz;addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(S.data&&(S.view==='report'||S.panel))render()},200)});

</script>
</body>
